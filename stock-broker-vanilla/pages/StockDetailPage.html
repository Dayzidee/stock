<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Stock Detail - Stock Broker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#00D4AA',
                        success: '#00D4AA',
                        danger: '#FF5A5F',
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        .safe-area-top {
            padding-top: env(safe-area-inset-top);
        }
    </style>
</head>

<body class="bg-gray-50 flex flex-col min-h-screen">

    <!-- Header Component -->
    <div class="sticky top-0 bg-white border-b border-gray-200 z-40 safe-area-top">
        <div class="flex items-center justify-between px-4 h-14">
            <button onclick="window.history.back()">
                <i data-lucide="chevron-left" class="w-6 h-6 text-gray-900"></i>
            </button>
            <h1 id="stock-symbol" class="text-lg font-semibold text-gray-900 uppercase tracking-wide">SYMBOL</h1>
            <div class="flex items-center space-x-4">
                <button class="text-primary p-1 rounded-full bg-primary/10">
                    <i data-lucide="check" class="w-4 h-4"></i>
                </button>
            </div>
        </div>
    </div>

    <main class="flex-1 pb-8">
        <!-- Price Info -->
        <div class="bg-white px-4 pt-4">
            <h2 id="stock-name" class="text-3xl font-bold text-gray-900 tracking-tight">Stock Name</h2>
            <div class="flex items-center mt-2 space-x-2">
                <div class="flex items-center">
                    <span id="stock-price" class="text-3xl font-bold text-gray-900">$0.00</span>
                    <i id="price-arrow" data-lucide="trending-up" class="w-6 h-6 ml-1 text-primary"></i>
                </div>
                <span id="stock-change" class="text-sm font-medium">+$0.00 (0.00%)</span>
            </div>
        </div>

        <!-- Chart Section -->
        <div class="bg-white px-4 pb-4">
            <div class="h-48 -mx-4 mt-4">
                <canvas id="stock-chart"></canvas>
            </div>

            <!-- Timeframe Selector -->
            <div id="timeframe-selector" class="flex items-center justify-between mt-4">
                <div class="flex flex-1 justify-between mr-4">
                    <button class="px-3 py-1 rounded text-xs font-bold bg-primary text-white">1D</button>
                    <button class="px-3 py-1 rounded text-xs font-bold text-gray-500 hover:bg-gray-100">1W</button>
                    <button class="px-3 py-1 rounded text-xs font-bold text-gray-500 hover:bg-gray-100">1M</button>
                    <button class="px-3 py-1 rounded text-xs font-bold text-gray-500 hover:bg-gray-100">3M</button>
                    <button class="px-3 py-1 rounded text-xs font-bold text-gray-500 hover:bg-gray-100">1Y</button>
                    <button class="px-3 py-1 rounded text-xs font-bold text-gray-500 hover:bg-gray-100">5Y</button>
                </div>
                <button class="p-1 text-gray-500 hover:bg-gray-100 rounded">
                    <i data-lucide="candlestick-chart" class="w-5 h-5"></i>
                </button>
            </div>
        </div>

        <!-- Trade Button -->
        <div class="bg-white px-4 py-4 border-t border-gray-100">
            <button id="trade-btn"
                class="w-full bg-primary text-white py-4 rounded-full text-lg font-bold hover:bg-opacity-90 transition-all shadow-lg shadow-primary/20">
                Trade
            </button>
        </div>

        <!-- Stats Component -->
        <div class="mt-4 px-4">
            <div class="bg-white rounded-lg p-4">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-lg font-semibold text-gray-900">Stats</h3>
                    <button onclick="toggleGreeksModal()" class="text-gray-400 hover:text-gray-600">
                        <i data-lucide="info" class="w-5 h-5"></i>
                    </button>
                </div>
                <div id="stats-grid" class="grid grid-cols-2 gap-4">
                    <!-- Stats will be injected here -->
                </div>
            </div>
        </div>

        <!-- Your Position Section -->
        <div class="mt-4 px-4 mb-4">
            <div class="bg-white rounded-lg p-4">
                <h3 class="text-lg font-semibold text-gray-900 mb-4">Your Position</h3>
                <div class="flex justify-between items-center">
                    <div>
                        <p id="shares-label" class="text-xs text-gray-500 font-medium uppercase">STOCK SHARES</p>
                        <p id="shares-count" class="text-base font-semibold text-gray-900 mt-1">0</p>
                    </div>
                    <div class="text-right">
                        <button class="bg-danger text-white px-6 py-2 rounded-lg font-bold">Trade</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Bottom Sheet -->
    <div id="bottom-sheet" class="fixed inset-0 z-50 invisible">
        <div id="bottom-sheet-overlay" class="absolute inset-0 bg-black/40 opacity-0 transition-opacity duration-300"></div>
        <div id="bottom-sheet-content" class="absolute bottom-0 left-0 right-0 bg-white rounded-t-[32px] p-6 pb-10 transform translate-y-full transition-transform duration-300">
            <div class="flex flex-col space-y-3">
                <button onclick="navigateToOptions('all')" class="w-full py-4 bg-gray-100 text-gray-900 rounded-2xl font-bold text-lg hover:bg-gray-200 transition-colors">View All Options</button>
                <button onclick="navigateToOptions('sell')" class="w-full py-4 bg-gray-100 text-gray-900 rounded-2xl font-bold text-lg hover:bg-gray-200 transition-colors">Sell</button>
                <button onclick="navigateToOptions('buy')" class="w-full py-4 bg-primary text-white rounded-2xl font-bold text-lg hover:opacity-90 transition-opacity">Buy</button>

                <div class="flex justify-center pt-4">
                    <button onclick="toggleBottomSheet()" class="w-12 h-12 flex items-center justify-center bg-gray-100 rounded-full text-gray-900 hover:bg-gray-200 transition-colors">
                        <i data-lucide="x" class="w-6 h-6"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Greeks Modal -->
    <div id="greeks-modal" class="fixed inset-0 z-50 invisible">
        <div id="greeks-overlay" class="absolute inset-0 bg-black/40 opacity-0 transition-opacity duration-300"></div>
        <div id="greeks-content" class="absolute inset-x-4 top-1/2 -translate-y-1/2 bg-white rounded-3xl p-6 transform scale-95 opacity-0 transition-all duration-300">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-bold text-gray-900">Statistics</h3>
                <button onclick="toggleGreeksModal()" class="text-gray-400">
                    <i data-lucide="x" class="w-6 h-6"></i>
                </button>
            </div>

            <div class="space-y-6">
                <div class="grid grid-cols-2 gap-y-4 gap-x-8">
                    <div>
                        <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Bid/Ask</p>
                        <p id="modal-bid-ask" class="text-sm font-bold text-gray-900 mt-0.5">$0.00 x 0</p>
                    </div>
                    <div>
                        <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Mark</p>
                        <p id="modal-mark" class="text-sm font-bold text-gray-900 mt-0.5">$0.00</p>
                    </div>
                    <div>
                        <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Open Interest</p>
                        <p id="modal-oi" class="text-sm font-bold text-gray-900 mt-0.5">0</p>
                    </div>
                    <div>
                        <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Implied Vol.</p>
                        <p id="modal-iv" class="text-sm font-bold text-gray-900 mt-0.5">0.00%</p>
                    </div>
                    <div>
                        <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Chance of Profit</p>
                        <p id="modal-cop" class="text-sm font-bold text-gray-900 mt-0.5">0.00%</p>
                    </div>
                </div>

                <div class="pt-6 border-t border-gray-100">
                    <h4 class="text-sm font-bold text-gray-900 mb-4 uppercase tracking-widest text-center">The Greeks</h4>
                    <div class="grid grid-cols-4 gap-2">
                        <div class="text-center">
                            <p class="text-[10px] font-bold text-gray-400 uppercase">Delta</p>
                            <p id="greek-delta" class="text-xs font-bold text-gray-900 mt-0.5">0.000</p>
                        </div>
                        <div class="text-center">
                            <p class="text-[10px] font-bold text-gray-400 uppercase">Gamma</p>
                            <p id="greek-gamma" class="text-xs font-bold text-gray-900 mt-0.5">0.000</p>
                        </div>
                        <div class="text-center">
                            <p class="text-[10px] font-bold text-gray-400 uppercase">Theta</p>
                            <p id="greek-theta" class="text-xs font-bold text-gray-900 mt-0.5">0.000</p>
                        </div>
                        <div class="text-center">
                            <p class="text-[10px] font-bold text-gray-400 uppercase">Vega</p>
                            <p id="greek-vega" class="text-xs font-bold text-gray-900 mt-0.5">0.000</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Shared Mock Data and Utilities
        const mockData = {
            portfolio: {
                totalValue: 1444.57,
                cash: 18.09,
                buyingPower: 408.07,
                todayChange: -9.21,
                todayChangePercent: -0.81,
                initialValue: 1300.00
            },
            stocks: [
                { symbol: 'SPY', name: 'SPDR S&P 500 ETF', price: 327.73, change: 1.49, changePercent: 0.45, shares: 100 },
                { symbol: 'AAPL', name: 'Apple Inc.', price: 312.68, change: -4.32, changePercent: -1.4, shares: 10 },
                { symbol: 'AMD', name: 'Advanced Micro Devices', price: 48.62, change: -0.53, changePercent: -1.1, shares: 50 },
                { symbol: 'TSLA', name: 'Tesla, Inc.', price: 182.63, change: 12.45, changePercent: 7.31, shares: 5 }
            ]
        };

        const formatters = {
            currency: (val) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(val),
            percent: (val) => (val > 0 ? '+' : '') + val.toFixed(2) + '%',
            number: (val) => {
                if (val >= 1000000) return (val / 1000000).toFixed(1) + 'M';
                if (val >= 1000) return (val / 1000).toFixed(1) + 'K';
                return val.toFixed(0);
            },
            color: (val) => (val > 0 ? 'text-green-500' : val < 0 ? 'text-red-500' : 'text-gray-600'),
            bgColor: (val) => (val > 0 ? 'bg-green-500' : val < 0 ? 'bg-red-500' : 'bg-gray-400')
        };

        const urlParams = new URLSearchParams(window.location.search);
        const symbol = urlParams.get('symbol') || 'SPY';

        const stock = mockData.stocks.find(s => s.symbol === symbol);
        if (!stock) {
            document.body.innerHTML = '<div class="p-8 text-center text-gray-500">Stock not found</div>';
        } else {
            initPage();
        }

        function initPage() {
            document.getElementById('stock-symbol').textContent = stock.symbol;
            document.getElementById('stock-name').textContent = stock.name;
            document.getElementById('stock-price').textContent = formatters.currency(stock.price);

            const changeEl = document.getElementById('stock-change');
            const isPos = stock.change >= 0;
            changeEl.textContent = `${isPos ? '+' : ''}${formatters.currency(stock.change)} (${formatters.percent(stock.changePercent)})`;
            changeEl.className = `text-sm font-medium ${formatters.color(stock.change)}`;

            const priceArrow = document.getElementById('price-arrow');
            priceArrow.setAttribute('data-lucide', isPos ? 'trending-up' : 'trending-down');
            priceArrow.className = `w-6 h-6 ml-1 ${formatters.color(stock.change)}`;

            document.getElementById('shares-label').textContent = `${stock.symbol} SHARES`;
            document.getElementById('shares-count').textContent = stock.shares || 0;

            document.getElementById('trade-btn').onclick = toggleBottomSheet;

            // Stats
            const stats = {
                bid: stock.price - 0.01,
                bidSize: 507,
                ask: stock.price + 0.01,
                askSize: 127,
                mark: stock.price,
                prevClose: stock.price - stock.change,
                high: stock.price + 2.5,
                low: stock.price - 1.8,
                volume: 4408,
            };

            const statsGrid = document.getElementById('stats-grid');
            const statItems = [
                { label: 'BID', value: `${formatters.currency(stats.bid)} x ${stats.bidSize}` },
                { label: 'ASK', value: `${formatters.currency(stats.ask)} x ${stats.askSize}` },
                { label: 'MARK', value: formatters.currency(stats.mark) },
                { label: 'PREV CLOSE', value: formatters.currency(stats.prevClose) },
                { label: 'HIGH', value: formatters.currency(stats.high) },
                { label: 'LOW', value: formatters.currency(stats.low) },
                { label: 'VOLUME', value: formatters.number(stats.volume) },
            ];

            statItems.forEach(item => {
                const div = document.createElement('div');
                div.innerHTML = `
                    <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">${item.label}</p>
                    <p class="text-sm font-bold text-gray-900 mt-0.5">${item.value}</p>
                `;
                statsGrid.appendChild(div);
            });

            // Pre-fill Modal
            document.getElementById('modal-bid-ask').textContent = `${formatters.currency(stats.bid)} x ${stats.bidSize}`;
            document.getElementById('modal-mark').textContent = formatters.currency(stats.mark);
            document.getElementById('modal-oi').textContent = '12,408';
            document.getElementById('modal-iv').textContent = '32.4%';
            document.getElementById('modal-cop').textContent = '68.2%';
            document.getElementById('greek-delta').textContent = '0.524';
            document.getElementById('greek-gamma').textContent = '0.042';
            document.getElementById('greek-theta').textContent = '-0.124';
            document.getElementById('greek-vega').textContent = '0.081';

            // Main Chart
            const ctx = document.getElementById('stock-chart').getContext('2d');
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: Array(20).fill(''),
                    datasets: [{
                        data: Array.from({ length: 20 }, () => stock.price * (0.98 + Math.random() * 0.04)),
                        borderColor: isPos ? '#00D4AA' : '#FF5A5F',
                        borderWidth: 2,
                        pointRadius: 0,
                        tension: 0.4,
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { x: { display: false }, y: { display: false } }
                }
            });

            lucide.createIcons();
        }

        function toggleBottomSheet() {
            const sheet = document.getElementById('bottom-sheet');
            const overlay = document.getElementById('bottom-sheet-overlay');
            const content = document.getElementById('bottom-sheet-content');
            const isVisible = !sheet.classList.contains('invisible');

            if (isVisible) {
                overlay.classList.replace('opacity-100', 'opacity-0');
                content.classList.add('translate-y-full');
                setTimeout(() => sheet.classList.add('invisible'), 300);
            } else {
                sheet.classList.remove('invisible');
                setTimeout(() => {
                    overlay.classList.replace('opacity-0', 'opacity-100');
                    content.classList.remove('translate-y-full');
                }, 10);
            }
        }

        function toggleGreeksModal() {
            const modal = document.getElementById('greeks-modal');
            const overlay = document.getElementById('greeks-overlay');
            const content = document.getElementById('greeks-content');
            const isVisible = !modal.classList.contains('invisible');

            if (isVisible) {
                overlay.classList.replace('opacity-100', 'opacity-0');
                content.classList.add('scale-95', 'opacity-0');
                setTimeout(() => modal.classList.add('invisible'), 300);
            } else {
                modal.classList.remove('invisible');
                setTimeout(() => {
                    overlay.classList.replace('opacity-0', 'opacity-100');
                    content.classList.remove('scale-95', 'opacity-0');
                }, 10);
            }
        }

        function navigateToOptions(strategy) {
            let url = `OptionsPage.html?symbol=${stock.symbol}`;
            if (strategy === 'buy' || strategy === 'sell') {
                url += `&strategy=${strategy}`;
            }
            window.location.href = url;
        }
    </script>
</body>

</html>
