<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Transfer - Stock Broker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#00D4AA',
                        success: '#00D4AA',
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        .safe-area-top {
            padding-top: env(safe-area-inset-top);
        }
    </style>
</head>

<body class="bg-white flex flex-col min-h-screen">

    <div class="p-4 safe-area-top">
        <div class="flex items-center mb-6">
            <button onclick="window.history.back()" class="text-green-600 mr-4 p-2 hover:bg-gray-100 rounded-full">
                <i data-lucide="arrow-left" class="w-6 h-6"></i>
            </button>
            <h1 class="text-3xl font-bold">Transfer to Robinhood</h1>
        </div>

        <form id="transfer-form" class="space-y-6">
            <div>
                <label for="amount" class="block text-lg font-semibold mb-2">Amount</label>
                <div class="relative">
                    <span class="absolute left-4 top-1/2 -translate-y-1/2 text-2xl font-bold text-gray-400">$</span>
                    <input type="number" id="amount" placeholder="0.00"
                        class="w-full pl-10 p-4 border border-gray-300 rounded-xl text-3xl font-bold focus:outline-none focus:ring-2 focus:ring-green-500"
                        min="0" step="0.01" required />
                </div>
            </div>

            <div>
                <label for="fromAccount" class="block text-lg font-semibold mb-2">From</label>
                <select id="fromAccount"
                    class="w-full p-4 border border-gray-300 rounded-xl text-lg bg-white focus:outline-none focus:ring-2 focus:ring-green-500 appearance-none">
                    <option>Bank of America (•••• 1234)</option>
                    <option>Wells Fargo (•••• 5678)</option>
                </select>
            </div>

            <div>
                <label for="toAccount" class="block text-lg font-semibold mb-2">To</label>
                <input type="text" id="toAccount" value="Robinhood Brokerage" readOnly
                    class="w-full p-4 border border-gray-300 rounded-xl text-lg bg-gray-50 text-gray-500 focus:outline-none" />
            </div>

            <button type="submit"
                class="w-full bg-green-600 text-white py-4 rounded-xl text-lg font-bold shadow-lg hover:bg-green-700 active:scale-[0.98] transition-all">
                Initiate Transfer
            </button>
        </form>
    </div>

    <script>
        document.getElementById('transfer-form').onsubmit = (e) => {
            e.preventDefault();
            const amt = document.getElementById('amount').value;
            alert(`Transfer of $${amt} initiated!`);
            window.history.back();
        };

        lucide.createIcons();
    </script>
</body>

</html>
